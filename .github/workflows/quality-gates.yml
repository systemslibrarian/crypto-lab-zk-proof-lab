name: Browser Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type-check crypto core (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest — crypto correctness gate)
        run: npm test

      - name: Install Playwright
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          echo $! > /tmp/zkpl_server.pid

      - name: Run browser quality checks
        env:
          ZKPL_BASE_URL: http://127.0.0.1:8000
        run: node tests/browser-quality.mjs

      - name: Run accessibility audit
        env:
          ZKPL_BASE_URL: http://127.0.0.1:8000
        run: node tests/accessibility-audit.mjs

      - name: Capture screenshots
        env:
          ZKPL_BASE_URL: http://127.0.0.1:8000
        run: node tests/capture-visuals.mjs

      - name: Capture scenario videos
        env:
          ZKPL_BASE_URL: http://127.0.0.1:8000
        run: node tests/capture-videos.mjs

      - name: Build GIF preview (best effort)
        run: |
          chmod +x tests/make-visual-gif.sh
          ./tests/make-visual-gif.sh

      - name: Stop static server
        if: always()
        run: |
          if [[ -f /tmp/zkpl_server.pid ]]; then
            kill "$(cat /tmp/zkpl_server.pid)" || true
          fi

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-capture
          path: artifacts/
          if-no-files-found: warn

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: browser-quality
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge minor and patch bumps
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
